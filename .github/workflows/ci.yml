name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Smoke-test the packed tarball (latest zod)
        run: bun run smoke
      - name: Smoke-test the packed tarball (lowest supported zod)
        run: bun run smoke
        env:
          ZOD_VERSION: 4.1.0
