name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Smoke-test the packed tarball (latest zod)
        run: bun run smoke
      - name: Smoke-test the packed tarball (lowest supported zod)
        run: bun run smoke
        env:
          ZOD_VERSION: 4.1.0
  plugin-version:
    # Installed plugins only update when plugin.json's version changes, so a
    # PR that changes the plugin must bump it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node packages/dev/scripts/check-version.ts "origin/$GITHUB_BASE_REF"
