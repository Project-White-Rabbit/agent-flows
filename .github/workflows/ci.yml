name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Smoke-test the packed tarball (latest zod)
        run: scripts/smoke-pack.sh
      - name: Smoke-test the packed tarball (lowest supported zod)
        run: scripts/smoke-pack.sh
        env:
          ZOD_VERSION: 4.1.0
