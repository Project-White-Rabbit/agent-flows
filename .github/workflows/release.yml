name: Release

# Publishes @agent-flows/core to npm on every push to main whose
# packages/core/package.json version is not on npm yet, then tags the commit
# core@X.Y.Z and creates a GitHub release. Pushes that don't bump the version
# are a no-op. Uses npm trusted publishing (OIDC), so no npm token is stored in
# the repo. Configure the trusted publisher on the @agent-flows/core package on
# npmjs.com: repo Project-White-Rabbit/agent-flows, workflow release.yml.
#
# Also tags each new version of the agent-flows Claude Code plugin
# (packages/dev/.claude-plugin/plugin.json) as agent-flows--vX.Y.Z with a
# GitHub release. The plugin ships from the marketplace in this repo, so
# merging is what releases it; the tag records which commit each version is.
# If the version is already released but the plugin changed since, the job
# fails: those changes can't reach users until the version is bumped.
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check whether this version is already published
        id: version
        working-directory: packages/core
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: bun run validate
      # npm, not bun publish: only npm supports trusted publishing and provenance.
      # prepublishOnly is skipped since validate just ran.
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/core
        run: npm publish --ignore-scripts
      - name: Tag and create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: core@${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
  tag-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag and create the GitHub release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node packages/dev/scripts/version.ts release)
          if [ -z "$tag" ]; then
            echo "This plugin version is already released; nothing to do"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "agent-flows plugin ${tag#agent-flows--v}" --generate-notes
          fi
