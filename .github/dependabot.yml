version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Dev dependencies only: @agent-flows/core's one runtime dependency is a zod
  # peer range, and the plugin has none.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
